<!DOCTYPE html>
<html lang='vi'>
<head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'><title>AimLock HZZ</title>
<style>
:root{--bg:#000;--white:#fff;--muted:#a7a7ae;--border:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
.mitxy_bg{position:fixed;inset:0;background:#000;z-index:0}
.mitxy_screen{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;overflow:hidden}
.hidden{display:none!important}

/* SPLASH */
#mitxy_js_splash_box{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;padding-top:18vh}
.mitxy_splash_logo{width:min(72vw,330px);height:auto;display:block}
.mitxy_splash_title{margin-top:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:clamp(25px,6vw,38px);font-weight:900;letter-spacing:1.8px;white-space:nowrap}
.mitxy_splash_sub{margin-top:10px;color:#a5a5ad;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.mitxy_progress_wrap{width:min(72vw,470px);margin-top:38px}
.mitxy_progress_track{height:9px;width:100%;border-radius:99px;background:#171719;border:1px solid rgba(255,255,255,.17);overflow:hidden}
.mitxy_progress_fill{height:100%;width:0;background:#eee;border-radius:99px;transition:width .3s ease}
.mitxy_progress_info{display:flex;justify-content:space-between;margin-top:12px;color:#a4a4ab;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.mitxy_splash_credits{position:absolute;left:0;right:0;bottom:74px;text-align:center;color:#a7a7af;font-size:12px;line-height:1.6}

/* LOGIN */
#mitxy_js_login_box{
  display:none;opacity:0;width:100%;height:100%;
  position:relative;padding:0 36px;
  transition:opacity .35s ease;
}
.mitxy_lang{
  position:absolute;right:36px;top:101px;
  width:120px;height:68px;border-radius:36px;
  border:1px solid rgba(255,255,255,.18);
  background:#121214;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:22px;font-weight:700;
}
.mitxy_lang_icon{font-size:30px;line-height:1}
.mitxy_login_content{
  width:100%;max-width:756px;margin:0 auto;text-align:center;
  padding-top:321px;
}
.mitxy_login_logo{width:230px;height:auto;display:block;margin:0 auto}
.mitxy_login_title{
  margin-top:40px;font-size:60px;line-height:1;
  font-weight:900;letter-spacing:1px;white-space:nowrap
}
.mitxy_login_status{
  margin-top:27px;color:#aaaab1;font-size:29px;font-weight:650
}
.mitxy_login_desc{
  margin-top:69px;margin-bottom:61px;color:#b9b9c0;
  font-size:26px;line-height:1.25;white-space:nowrap
}
.mitxy_card{
  width:100%;padding:42px 42px 39px;
  border-radius:27px;
  background:linear-gradient(145deg,#19191b,#0e0e10);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 55px rgba(0,0,0,.55);
  text-align:left;
}
.mitxy_label{
  display:block;margin-bottom:25px;color:#aaaab1;
  font:800 22px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:1.4px
}
#mitxy_js_key_input{
  display:block;width:100%;height:139px;padding:0 25px;
  border-radius:24px;border:2px solid rgba(255,255,255,.16);
  background:#090909;color:#fff;outline:none;
  font-size:24px
}
#mitxy_js_key_input:focus{border-color:rgba(255,255,255,.35)}
.mitxy_btn{
  width:100%;height:96px;margin-top:30px;border:0;border-radius:25px;
  background:#fff;color:#080808;font-size:30px;font-weight:850;
  display:flex;align-items:center;justify-content:center;gap:18px
}
.mitxy_btn:active,.mitxy_small:active{transform:scale(.985)}
.mitxy_btn:disabled{opacity:.6}
.mitxy_btn_icon{font-size:29px}
.mitxy_btn_row{display:grid;grid-template-columns:1fr 1fr;gap:31px;margin-top:29px}
.mitxy_small{
  height:94px;border:0;border-radius:25px;background:#fff;color:#080808;
  font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px
}
.mitxy_small_icon{font-size:29px}
.mitxy_err{display:none;margin-bottom:18px;padding:13px;border-radius:12px;color:#ff9292;background:rgba(255,60,60,.08);font-size:15px;text-align:center}
.mitxy_login_credits{
  margin-top:105px;padding-bottom:25px;text-align:center;
  color:#a7a7af;font-size:18px;line-height:1.6
}
@media(max-width:600px){
  .mitxy_lang{right:36px;top:101px;width:120px;height:68px;font-size:22px}
  .mitxy_login_content{padding-top:228px}
  .mitxy_login_logo{width:235px}
  .mitxy_login_title{margin-top:40px;font-size:47px}
  .mitxy_login_status{margin-top:27px;font-size:29px}
  .mitxy_login_desc{margin-top:67px;margin-bottom:61px;font-size:25px}
  .mitxy_card{padding:40px 42px 38px;border-radius:28px}
  .mitxy_label{font-size:21px;margin-bottom:24px}
  #mitxy_js_key_input{height:138px}
  .mitxy_btn{height:95px;font-size:30px}
  .mitxy_small{height:94px;font-size:27px}
  .mitxy_login_credits{margin-top:105px;font-size:18px}
}
@media(max-width:600px) and (max-height:1550px){
  .mitxy_login_content{padding-top:190px}
  .mitxy_login_logo{width:210px}
  .mitxy_login_title{margin-top:30px;font-size:43px}
  .mitxy_login_status{margin-top:23px;font-size:25px}
  .mitxy_login_desc{margin-top:55px;margin-bottom:50px;font-size:22px}
  .mitxy_card{padding:31px 34px 30px}
  .mitxy_label{font-size:18px;margin-bottom:18px}
  #mitxy_js_key_input{height:105px;border-radius:22px}
  .mitxy_btn{height:84px;margin-top:24px;font-size:26px;border-radius:23px}
  .mitxy_btn_row{gap:22px;margin-top:22px}
  .mitxy_small{height:82px;font-size:23px;border-radius:22px}
  .mitxy_login_credits{margin-top:70px;font-size:16px}
}
</style>
</head>

<script>
function mitxy_js_get_key(){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.mitxy_bridge)
    window.webkit.messageHandlers.mitxy_bridge.postMessage({action:'get_key'});
}
function mitxy_js_open_discord(){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.mitxy_bridge)
    window.webkit.messageHandlers.mitxy_bridge.postMessage({action:'discord'});
}
function mitxy_js_toggle_language(){
  const t=document.getElementById('mitxy_js_lang_text');
  const s=document.getElementById('mitxy_js_login_status');
  const d=document.getElementById('mitxy_js_login_sub');
  const a=document.getElementById('mitxy_js_activate_text');
  const dis=document.getElementById('mitxy_js_discord_text');
  const en=t.textContent==='VI';
  t.textContent=en?'EN':'VI';
  s.textContent=en?'SYSTEM READY':'HỆ THỐNG ĐÃ SẴN SÀNG';
  d.textContent=en?'Enter License Key to unlock Online Mod Menu':'Nhập License Key để mở khóa Mod Menu Online';
  a.textContent=en?'Activate':'Kích Hoạt';
  dis.textContent=en?'Discord Group':'Nhóm Discord';
}
</script>
<script>
            let mitxy_js_p = 0;
            const mitxy_js_pBar = document.getElementById('mitxy_js_progress_bar');
            const mitxy_js_status = document.getElementById('mitxy_js_splash_status');

            const mitxy_js_timer = setInterval(() => {
              mitxy_js_p += 25;
              if (mitxy_js_pBar) mitxy_js_pBar.style.width = mitxy_js_p + '%';
              if (mitxy_js_p === 50 && mitxy_js_status) mitxy_js_status.innerText = 'Đang kiểm tra kết nối...';
              if (mitxy_js_p === 75 && mitxy_js_status) mitxy_js_status.innerText = 'Sẵn sàng xác thực...';
            if (mitxy_js_p >= 100) {
                clearInterval(mitxy_js_timer);
                setTimeout(() => {
                  const splashBox = document.getElementById('mitxy_js_splash_box');
                  const loginBox = document.getElementById('mitxy_js_login_box');
                  if (splashBox) splashBox.style.display = 'none';
                  if (loginBox) {
                    loginBox.style.display = 'block';
                    setTimeout(() => { loginBox.style.opacity = '1'; }, 50);
                  }
                  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mitxy_bridge) {
                    window.webkit.messageHandlers.mitxy_bridge.postMessage({ action: 'splash_complete' });
                  }
                }, 300);
              }
            }, 300);

            function mitxy_js_submit() {
              const input = document.getElementById('mitxy_js_key_input');
              const keyVal = input ? input.value.trim() : '';
              if (!keyVal) {
                mitxy_js_show_error('Vui lòng nhập Key kích hoạt!');
                return;
              }
              mitxy_js_show_error('');
              mitxy_js_set_loading(true);

              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mitxy_bridge) {
                window.webkit.messageHandlers.mitxy_bridge.postMessage({ action: 'activate', key: keyVal });
              }
            }

            function mitxy_js_set_loading(isLoading) {
              const btn = document.getElementById('mitxy_js_btn_submit');
              if (btn) {
                btn.disabled = isLoading;
                btn.innerHTML = isLoading ? '<span>ĐANG XỬ LÝ...</span>' : '<span>KÍCH HOẠT NGAY</span>';
              }
            }

            function mitxy_js_show_error(msg) {
              const errBox = document.getElementById('mitxy_js_err_msg');
              if (errBox) {
                if (msg) {
                  errBox.innerText = msg;
                  errBox.style.display = 'block';
                } else {
                  errBox.style.display = 'none';
                }
              }
            }
          </script></body></html>
