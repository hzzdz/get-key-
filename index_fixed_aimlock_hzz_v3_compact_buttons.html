<!DOCTYPE html>
        <html lang="vi">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Login</title>
          <style>
:root{
  --bg:#000;
  --card:#121214;
  --border:rgba(255,255,255,.14);
  --text:#fff;
  --sub:#a4a4ab;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body{width:100%;height:100%;background:#000;color:#fff}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
.mitxy_css_bg_grid{
  position:fixed;inset:0;width:100%;height:100%;
  background:#000;z-index:0;pointer-events:none;
}
.mitxy_css_container{
  position:relative;z-index:2;width:100%;max-width:760px;
  text-align:center;transition:opacity .4s ease;
}
#mitxy_js_splash_box{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:100%;min-height:100vh;padding:18vh 22px 0;
}
.mitxy_css_splash_logo{
  width:min(72vw,330px);height:auto;display:block;margin-bottom:18px;
}
.mitxy_css_splash_title{
  font-size:clamp(25px,6vw,39px);font-weight:900;
  letter-spacing:2px;line-height:1;white-space:nowrap;
}
.mitxy_css_splash_sub{
  margin-top:10px;color:#a5a5ad;font-size:clamp(13px,3.5vw,17px);
}
.mitxy_css_progress_wrap{width:min(72vw,470px);margin-top:38px;text-align:left}
.mitxy_css_progress_track{

  width:100%;

  height:9px;

  background:#1a1a1a;

  border:1px solid #3b3b3b;

  border-radius:999px;

  overflow:hidden;

}

.mitxy_css_progress_fill{

  width:0;

  height:100%;

  background:linear-gradient(90deg,#ffffff,#d8d8d8);

  transition:width .3s ease;

  border-radius:999px;
  
}
#mitxy_js_key_input::placeholder{

  font-size:15px;

}
.mitxy_css_progress_info{
  display:flex;justify-content:space-between;margin-top:12px;
  color:#a4a4ab;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;
}
.mitxy_css_credits{
  position:absolute;left:20px;right:20px;bottom:74px;
  color:#a7a7af;font-size:13px;line-height:1.6;text-align:center;
}

#mitxy_js_login_box{
  display:none;opacity:0;width:100%;min-height:100vh;
  padding:30px 18px 35px;overflow-y:auto;
}
.mitxy_css_lang{
  position:absolute;right:18px;top:18px;
  height:43px;min-width:98px;padding:0 16px;
  border:1px solid var(--border);border-radius:24px;
  background:#111113;color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.mitxy_css_login_logo{
  width:118px;height:auto;margin:34px auto 16px;display:block;
}
.mitxy_css_title{
  font-size:31px;font-weight:900;letter-spacing:1px;line-height:1;
  white-space:nowrap;
}
.mitxy_css_status{
  margin-top:13px;color:#aaaab1;font-size:15px;font-weight:600;
}
.mitxy_css_sub{
  margin:31px auto 27px;color:#b8b8bf;font-size:15px;line-height:1.4;
}
.mitxy_css_card{
  width:100%;padding:27px 20px 29px;
  background:linear-gradient(145deg,rgba(25,25,27,.9),rgba(10,10,11,.88));
  border:1px solid var(--border);border-radius:23px;
  box-shadow:0 24px 70px rgba(0,0,0,.7);
  text-align:left;
}
.mitxy_css_label{
  display:block;margin-bottom:13px;color:#a7a7ae;
  font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.5px;
}
input[type="password"],input[type="text"]{
  width:100%;height:70px;padding:0 20px;
  background:#090909;border:1px solid rgba(255,255,255,.18);
  border-radius:19px;color:#fff;font-size:18px;font-weight:600;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.035)}
.mitxy_css_btn{

  width:100%;

  height:50px;

  padding:0;

  margin-top:15px;

  background:#fff;

  color:#000;

  border:none;

  border-radius:14px;

  font-weight:800;

  font-size:16px;

  display:flex;

  align-items:center;

  justify-content:center;
  
  gap:10px;

}
.activate-icon{

  width:20px;

  height:20px;

  flex-shrink:0;

}
.small-icon{

  width:20px;

  height:20px;

  flex-shrink:0;

}

.mitxy_css_small_btn{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:20px;

}
.mitxy_css_btn:active{transform:scale(.985)}
.mitxy_css_btn:disabled{opacity:.6}
.mitxy_css_row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mitxy_css_small_btn{
  height:44px;background:#fff;color:#080808;border:0;border-radius:12px;
  font-size:15px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.mitxy_css_err{
  display:none;margin-bottom:15px;padding:12px;border-radius:12px;
  color:#ff8d8d;background:rgba(255,55,55,.09);
  border:1px solid rgba(255,90,90,.18);font-size:14px;text-align:center;
}
.mitxy_css_login_credits{
  margin-top:48px;padding-bottom:25px;color:#a7a7af;
  font-size:12px;line-height:1.65;text-align:center;
}

@media(min-width:521px){
  #mitxy_js_login_box{padding-left:24px;padding-right:24px}
  .mitxy_css_login_logo{width:150px}
  .mitxy_css_title{font-size:43px}
  .mitxy_css_status{font-size:19px}
  .mitxy_css_sub{font-size:18px}
  .mitxy_css_card{padding:27px 28px 31px}
  input[type="password"],input[type="text"]{height:76px}
  .mitxy_css_btn,.mitxy_css_small_btn{height:50px}
  .mitxy_css_small_btn{font-size:15px}
}
@media(max-height:720px){
  #mitxy_js_splash_box{padding-top:8vh}
  .mitxy_css_splash_logo{width:210px}
  .mitxy_css_progress_wrap{margin-top:24px}
  .mitxy_css_credits{bottom:52px}
  #mitxy_js_login_box{padding-top:20px}
  .mitxy_css_login_logo{margin-top:20px;width:100px}
  .mitxy_css_sub{margin-top:20px;margin-bottom:18px}
  .mitxy_css_card{padding-top:20px;padding-bottom:22px}
  input[type="password"],input[type="text"]{height:56px}
  .mitxy_css_btn{height:50px}
  .mitxy_css_small_btn{height:44px}
}

/* splash -> login transition */
#mitxy_js_splash_box.is-done{display:none!important}
#mitxy_js_login_box.is-ready{display:block!important;opacity:1!important}
</style>

<script>
            let mitxy_js_p = 0;
            const mitxy_js_pBar = document.getElementById('mitxy_js_progress_bar');
            const mitxy_js_status = document.getElementById('mitxy_js_splash_status');

            const mitxy_js_timer = setInterval(() => {
              mitxy_js_p += 25;
              if (mitxy_js_pBar) mitxy_js_pBar.style.width = mitxy_js_p + '%';
               const mitxy_js_percent = document.getElementById('mitxy_js_progress_percent');
               if (mitxy_js_percent) mitxy_js_percent.innerText = mitxy_js_p + '%';
              if (mitxy_js_p === 50 && mitxy_js_status) mitxy_js_status.innerText = 'Đang kiểm tra kết nối...';
              if (mitxy_js_p === 75 && mitxy_js_status) mitxy_js_status.innerText = 'Sẵn sàng xác thực...';
            if (mitxy_js_p >= 100) {
                clearInterval(mitxy_js_timer);
                setTimeout(() => {
                  const splashBox = document.getElementById('mitxy_js_splash_box');
                  const loginBox = document.getElementById('mitxy_js_login_box');
                  if (splashBox) { splashBox.style.display = 'none'; splashBox.classList.add('is-done'); }
                  if (loginBox) {
                    loginBox.style.display = 'block';
                    loginBox.classList.add('is-ready');
                    setTimeout(() => { loginBox.style.opacity = '1'; }, 50);
                  }
                  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mitxy_bridge) {
                    window.webkit.messageHandlers.mitxy_bridge.postMessage({ action: 'splash_complete' });
                  }
                }, 300);
              }
            }, 300);

            function mitxy_js_submit() {
              const input = document.getElementById('mitxy_js_key_input');
              const keyVal = input ? input.value.trim() : '';
              if (!keyVal) {
                mitxy_js_show_error('Vui lòng nhập Key kích hoạt!');
                return;
              }
              mitxy_js_show_error('');
              mitxy_js_set_loading(true);

              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mitxy_bridge) {
                window.webkit.messageHandlers.mitxy_bridge.postMessage({ action: 'activate', key: keyVal });
              }
            }

            function mitxy_js_set_loading(isLoading) {
              const btn = document.getElementById('mitxy_js_btn_submit');
              if (btn) {
                btn.disabled = isLoading;
                btn.innerHTML = isLoading ? '<span>ĐANG XỬ LÝ...</span>' : '<span>KÍCH HOẠT NGAY</span>';
              }
            }

            function mitxy_js_show_error(msg) {
              const errBox = document.getElementById('mitxy_js_err_msg');
              if (errBox) {
                if (msg) {
                  errBox.innerText = msg;
                  errBox.style.display = 'block';
                } else {
                  errBox.style.display = 'none';
                }
              }
            }
          </script>

  const a=document.getElementById('mitxy_js_activate_text');
