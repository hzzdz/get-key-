<!DOCTYPE html>
        <html lang="vi">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Login</title>
          <style>
            :root {
              --mitxy_css_bg: #000000;
              --mitxy_css_card_bg: #121214;
              --mitxy_css_border: rgba(255, 255, 255, 0.12);
              --mitxy_css_text: #ffffff;
              --mitxy_css_subtext: #a1a1aa;
              --mitxy_css_green: #22c55e;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
            body {
              background: var(--mitxy_css_bg);
              color: var(--mitxy_css_text);
              min-height: 100vh;
              display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; overflow: hidden;
            }
            .mitxy_css_bg_grid {
              position: absolute; top: 0; left: 0; width: 100%; height: 100%;
              background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
              background-size: 30px 30px; z-index: 1; pointer-events: none;
            }
            .mitxy_css_container {
              position: relative; z-index: 2; width: 100%; max-width: 380px; text-align: center; transition: opacity 0.4s ease;
            }
            #mitxy_js_splash_box {
              display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 80vh;
            }
            .mitxy_css_spinner_ring {
              width: 90px; height: 90px; border-radius: 50%;
              border: 3px solid transparent; border-top-color: var(--mitxy_css_green); border-right-color: rgba(255, 255, 255, 0.8);
              animation: mitxy_anim_spin 1.2s linear infinite; margin-bottom: 24px; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
            }
            @keyframes mitxy_anim_spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .mitxy_css_progress_track {
              width: 220px; height: 6px; background: var(--mitxy_css_card_bg); border: 1px solid var(--mitxy_css_border); border-radius: 99px; overflow: hidden; margin-top: 20px;
            }
            .mitxy_css_progress_fill {
              width: 0%; height: 100%; background: linear-gradient(90deg, #ffffff, var(--mitxy_css_green)); transition: width 0.3s ease; border-radius: 99px;
            }
            #mitxy_js_login_box {
              display: none; opacity: 0; transition: opacity 0.5s ease; width: 100%;
            }
            .mitxy_css_badge {
              display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
              background: rgba(255, 255, 255, 0.06); border: 1px solid var(--mitxy_css_border);
              border-radius: 99px; font-size: 0.75rem; font-weight: 700; margin-bottom: 16px; letter-spacing: 0.5px;
            }
            .mitxy_css_dot { width: 8px; height: 8px; background: var(--mitxy_css_green); border-radius: 50%; box-shadow: 0 0 8px var(--mitxy_css_green); }
            .mitxy_css_title { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
            .mitxy_css_sub { font-size: 0.85rem; color: var(--mitxy_css_subtext); margin-bottom: 24px; line-height: 1.4; }
            .mitxy_css_card {
              background: var(--mitxy_css_card_bg); border: 1px solid var(--mitxy_css_border);
              border-radius: 20px; padding: 22px 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            }
            .mitxy_css_input_group { text-align: left; margin-bottom: 16px; }
            .mitxy_css_label { font-size: 0.72rem; font-weight: 700; color: var(--mitxy_css_subtext); text-transform: uppercase; margin-bottom: 6px; display: block; }
